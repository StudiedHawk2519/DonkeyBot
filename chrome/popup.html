<!DOCTYPE html>
<html>

<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --db-bg: #f7f3f1;
            --db-surface: #fffdfc;
            --db-surface-strong: #ffffff;
            --db-panel: #f4edea;
            --db-border: rgba(65, 43, 39, 0.1);
            --db-text: #2b1f1d;
            --db-text-muted: #7a605d;
            --db-accent: #d96b5c;
            --db-accent-dark: #bb564d;
            --db-accent-soft: rgba(217, 107, 92, 0.12);
            --db-white: #ffffff;
            --db-muted-bg: rgba(218, 197, 192, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            width: 320px;
            min-height: 240px;
            padding: 0;
            margin: 0;
            background: linear-gradient(180deg, #fbf7f5 0%, #f4efed 100%);
            font-family: 'Inter', sans-serif;
            color: var(--db-text);
            overflow-x: hidden;
        }

        .header {
            padding: 10px 14px;
            background: linear-gradient(90deg, #d96b5c 0%, #c85d4e 100%);
            border-bottom: 1px solid rgba(82, 56, 48, 0.14);
        }

        .logo-wrap {
            display: flex;
            justify-content: center;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 0;
            padding: 0;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #fff;
        }

        .logo-mark {
            display: none;
        }

        .logo span {
            color: #fff;
        }

        .container {
            padding: 12px;
        }

        .card {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .setting-option {
            padding: 12px 14px;
            background: #ffffff;
            border: 1px solid var(--db-border);
            border-radius: 14px;
            box-shadow: 0 8px 16px rgba(40, 22, 20, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 0;
            padding: 0;
        }

        .card-header b {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--db-text);
        }

        .info span {
            display: block;
            font-size: 11px;
            color: var(--db-text-muted);
            line-height: 1.5;
        }

        .info {
            margin-top: 8px;
        }

        .toggle-btn-wrapper {
            position: relative;
            width: 60px;
            height: 30px;
        }

        .toggle-btn-wrapper input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: rgba(63, 44, 41, 0.08);
            border: 1px solid rgba(63, 44, 41, 0.12);
            color: var(--db-text-muted);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.08em;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.16s ease;
            user-select: none;
            text-transform: uppercase;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .toggle-label::after {
            content: "OFF";
        }

        input:checked+.toggle-label {
            background: linear-gradient(90deg, #d96b5c 0%, #c85d4e 100%);
            border-color: rgba(133, 66, 60, 0.2);
            color: #fff;
        }

        input:checked+.toggle-label::after {
            content: "ON";
        }

        .toggle-label:active {
            transform: translateY(1px);
        }

        .api-field {
            margin-top: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px 14px;
            background: #ffffff;
            border: 1px solid var(--db-border);
            border-radius: 14px;
            box-shadow: 0 8px 16px rgba(40, 22, 20, 0.05);
        }

        .api-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .api-label {
            font-size: 11px;
            color: var(--db-text-muted);
            font-weight: 700;
        }

        .api-link {
            font-size: 10px;
            color: var(--db-accent);
            text-decoration: none;
            font-weight: 800;
        }

        .api-input {
            width: 100%;
            border: 1px solid rgba(65, 43, 39, 0.12);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.8);
            color: var(--db-text);
            padding: 10px 12px;
            font-size: 12px;
            outline: none;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .api-input::placeholder {
            color: #8b7b77;
        }

        .name-field {
            margin-top: 0;
            padding: 12px 14px;
            background: #ffffff;
            border: 1px solid var(--db-border);
            border-radius: 14px;
            box-shadow: 0 8px 16px rgba(40, 22, 20, 0.05);
        }

        .timer-field {
            margin-top: 0;
            padding: 12px 14px;
            background: #ffffff;
            border: 1px solid var(--db-border);
            border-radius: 14px;
            box-shadow: 0 8px 16px rgba(40, 22, 20, 0.05);
        }

        .name-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .name-label {
            font-size: 11px;
            color: var(--db-text-muted);
            font-weight: 700;
        }

        .name-input {
            width: 100%;
            border: 1px solid rgba(65, 43, 39, 0.12);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.8);
            color: var(--db-text);
            padding: 10px 12px;
            font-size: 12px;
            outline: none;
        }

        .name-input::placeholder {
            color: #8b7b77;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo-wrap">
            <div class="logo"><span class="logo-mark"></span>donkey<span>bot</span></div>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="setting-option">
                <div class="card-header">
                    <b>Sparx Maths</b>
                    <div class="toggle-btn-wrapper">
                        <input type="checkbox" id="donkeybot-toggle">
                        <label for="donkeybot-toggle" class="toggle-label"></label>
                    </div>
                </div>
                <div class="info">
                    <span>Enable the DonkeyBot helper for Sparx Maths questions.</span>
                </div>
            </div>

            <div class="api-field">
                <div class="api-label-row">
                    <label class="api-label" for="llm7-api-key">API key (optional)</label>
                    <a class="api-link" href="https://dash.llm7.io/#/api-keys" target="_blank"
                        rel="noopener noreferrer">Get key</a>
                </div>
                <input id="llm7-api-key" class="api-input" type="password"
                    placeholder="Optional — not required for LLM7" />
            </div>

            <div class="timer-field">
                <div class="name-header">
                    <label class="name-label" for="donkeybot-timer-toggle">Session timer</label>
                    <div class="toggle-btn-wrapper">
                        <input type="checkbox" id="donkeybot-timer-toggle">
                        <label for="donkeybot-timer-toggle" class="toggle-label"></label>
                    </div>
                </div>
            </div>

            <div class="name-field">
                <div class="name-header">
                    <label class="name-label" for="donkeybot-name">Change Sparx name</label>
                    <div class="toggle-btn-wrapper">
                        <input type="checkbox" id="donkeybot-name-toggle">
                        <label for="donkeybot-name-toggle" class="toggle-label"></label>
                    </div>
                </div>
                <input id="donkeybot-name" class="name-input" type="text" maxlength="40"
                    placeholder="Type a display name" />
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
